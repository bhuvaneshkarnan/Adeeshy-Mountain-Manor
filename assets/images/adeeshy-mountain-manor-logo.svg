<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 115" width="340" height="115">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3CE" />
      <stop offset="50%" stop-color="#C8A27A" />
      <stop offset="100%" stop-color="#9C774E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Handcrafted Mountain Peaks Crest (matches user sketch) -->
  <g transform="translate(170, 24)" filter="url(#shadow)">
    <!-- Triple Mountain Peaks -->
    <path d="M -30,12 L -18,-4 L -8,6 L 2,-14 L 14,3 L 22,-6 L 30,12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 2,-14 L 6,-3" stroke="#F2E3CE" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="2" cy="-19" r="2" fill="#C8A27A" />
  </g>
  <!-- Main Title: ADEESHY MANOR -->
  <text x="170" y="78" text-anchor="middle" fill="#FFFFFF" font-family="'PP Right Gothic Wide', 'Manrope', 'Montserrat', sans-serif" font-size="24" font-weight="300" letter-spacing="4" filter="url(#shadow)">ADEESHY MANOR</text>
  <!-- Location: SIRUMALAI -->
  <text x="170" y="101" text-anchor="middle" fill="#C8A27A" font-family="'Manrope', 'Montserrat', sans-serif" font-size="11" font-weight="700" letter-spacing="6" filter="url(#shadow)">SIRUMALAI</text>
</svg>